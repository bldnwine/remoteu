[project]
name = "remoteu"
version = "0.1.0"
description = "Phone remote for Linux — async python-evdev over WebSocket"
requires-python = ">=3.12"
dependencies = [
    "evdev>=1.7.0",
    "aiohttp>=3.9.0",
    "uvloop>=0.21; sys_platform == 'linux' and platform_python_implementation == 'CPython'",
]

[project.scripts]
remoteu = "remoteu:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]